<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cassette Body Gradient (Vibrant Amber/Coral) -->
    <linearGradient id="cassetteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Arrow Mint Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Shadow for Base Badge -->
  <rect x="44" y="44" width="440" height="440" rx="100" fill="#010409" />

  <!-- Base Badge (Dark Obsidian Slate) -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGrad)" stroke="#010409" stroke-width="12" />

  <!-- Subtle Inner Grid / Tech Dot Accents -->
  <circle cx="90" cy="90" r="6" fill="#334155" />
  <circle cx="422" cy="90" r="6" fill="#334155" />
  <circle cx="90" cy="422" r="6" fill="#334155" />
  <circle cx="422" cy="422" r="6" fill="#334155" />

  <!-- Cassette Outer Pop-Shadow -->
  <rect x="94" y="124" width="340" height="260" rx="32" fill="#010409" />

  <!-- Main Cassette Body (Amber) -->
  <rect x="86" y="116" width="340" height="260" rx="32" fill="url(#cassetteBody)" stroke="#010409" stroke-width="10" />

  <!-- Top Cassette Screws -->
  <circle cx="116" cy="144" r="6" fill="#B45309" stroke="#010409" stroke-width="3" />
  <circle cx="396" cy="144" r="6" fill="#B45309" stroke="#010409" stroke-width="3" />
  <circle cx="116" cy="348" r="6" fill="#B45309" stroke="#010409" stroke-width="3" />
  <circle cx="396" cy="348" r="6" fill="#B45309" stroke="#010409" stroke-width="3" />

  <!-- Cassette Label Area (Violet Sticker) -->
  <rect x="120" y="152" width="272" height="150" rx="16" fill="url(#labelGrad)" stroke="#010409" stroke-width="8" />

  <!-- Label Header Line Strip -->
  <rect x="140" y="168" width="232" height="12" rx="6" fill="#A78BFA" opacity="0.6" />

  <!-- Center Tape Window (Dark Cutout) -->
  <rect x="156" y="196" width="200" height="88" rx="20" fill="#0F172A" stroke="#010409" stroke-width="8" />

  <!-- Left Reel Spool -->
  <g transform="translate(196, 240)">
    <circle cx="0" cy="0" r="24" fill="#F8FAFC" stroke="#010409" stroke-width="6" />
    <circle cx="0" cy="0" r="10" fill="#0F172A" stroke="#010409" stroke-width="4" />
    <!-- Spool Teeth -->
    <rect x="-3" y="-20" width="6" height="8" rx="2" fill="#010409" />
    <rect x="-3" y="12" width="6" height="8" rx="2" fill="#010409" />
    <rect x="-20" y="-3" width="8" height="6" rx="2" fill="#010409" />
    <rect x="12" y="-3" width="8" height="6" rx="2" fill="#010409" />
  </g>

  <!-- Right Reel Spool -->
  <g transform="translate(316, 240)">
    <circle cx="0" cy="0" r="24" fill="#F8FAFC" stroke="#010409" stroke-width="6" />
    <circle cx="0" cy="0" r="10" fill="#0F172A" stroke="#010409" stroke-width="4" />
    <!-- Spool Teeth -->
    <rect x="-3" y="-20" width="6" height="8" rx="2" fill="#010409" />
    <rect x="-3" y="12" width="6" height="8" rx="2" fill="#010409" />
    <rect x="-20" y="-3" width="8" height="6" rx="2" fill="#010409" />
    <rect x="12" y="-3" width="8" height="6" rx="2" fill="#010409" />
  </g>

  <!-- Bottom Cassette Grip Notch -->
  <path d="M 170 376 L 190 336 L 322 336 L 342 376 Z" fill="#D97706" stroke="#010409" stroke-width="8" stroke-linejoin="round" />
  <circle cx="216" cy="356" r="6" fill="#010409" />
  <circle cx="296" cy="356" r="6" fill="#010409" />

  <!-- Center Download Arrow (Bold Pop-out Hero Element) -->
  <!-- Arrow Shadow -->
  <path d="M 256 168 L 256 264 M 224 236 L 256 272 L 288 236" fill="none" stroke="#010409" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(6, 6)" />
  
  <!-- Arrow Body (Neon Mint / Emerald) -->
  <path d="M 256 168 L 256 264 M 224 236 L 256 272 L 288 236" fill="none" stroke="url(#arrowGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Inner Core -->
  <path d="M 256 172 L 256 262 M 228 236 L 256 268 L 284 236" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Playful Neo-Brutalist 4-Point Star / Sparkle in Top-Right -->
  <g transform="translate(410, 100)">
    <!-- Star Shadow -->
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#010409" transform="translate(4, 4)" />
    <!-- Star Body (Electric Pink) -->
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FB7185" stroke="#010409" stroke-width="4" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
</svg>
